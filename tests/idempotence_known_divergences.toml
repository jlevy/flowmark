# Documents that do not reach a formatting fixed point in one pass.
#
# Asserted exactly by tests/test_idempotence_corpus.py: an unlisted failure fails the
# build, and an entry here that now passes also fails it, so this list shrinks and cannot
# rot. Every entry names the bead tracking its defect.
#
# Every entry predates the preservation work: each one also fails on the branch base
# 195b5ce. flowmark-rs keeps the same ledger at tests/idempotence_known_divergences.toml,
# and the two are deliberately separate — a defect one port carries and the other does
# not is exactly what the pair is meant to make visible. Today Rust carries 67 entries to
# this file's 138; defects E and F below are the Python-only difference.
#
# See the epic fm-sk2n.

schema_version = 1

