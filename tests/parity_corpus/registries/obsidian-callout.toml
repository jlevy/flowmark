schema_version = 1
corpus = "flowmark-language-neutral-conformance"

[[case]]
id = "preservation.extension.callout.fold-title"
change_id = "FM-EXT-OBSIDIAN-CALLOUT-001"
description = "An Obsidian callout retains its type, fold marker, title, quote prefixes, and body bytes."
kind = "stdin"
tags = ["blockquote", "callout", "desired-output", "extension", "obsidian", "preservation", "stdin"]
args = ["--width", "24", "--smartquotes", "--ellipses", "-"]
stdin = "tests/parity_corpus/cases/preservation/extensions/callout/fold-title/input.md"
expected_stdout = "tests/parity_corpus/cases/preservation/extensions/callout/fold-title/expected.stdout"
expected_stderr = "tests/parity_corpus/spec/commonmark-0.31.2/empty.stderr"
expected_exit = 0
idempotent = true

