expected_stderr = "tests/parity_corpus/spec/commonmark-0.31.2/empty.stderr"
expected_exit = 0
idempotent = true

[[case]]
id = "preservation.extension.raw-html.angle-comparisons"
change_id = "FM-EXT-RAW-HTML-001"
