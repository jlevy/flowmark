schema_version = 1
corpus = "flowmark-language-neutral-conformance"

[[case]]
id = "preservation.code-span.delimiter-runs"
change_id = "FM-CODE-SPAN-001"
description = "Arbitrary authored delimiter widths and unequal interior runs remain source-exact."
kind = "stdin"
tags = ["code-span", "desired-output", "preservation", "stdin"]
args = ["--width", "0", "-"]
stdin = "tests/parity_corpus/cases/preservation/code-span/delimiter-runs/input.md"
expected_stdout = "tests/parity_corpus/cases/preservation/code-span/delimiter-runs/expected.stdout"
expected_stderr = "tests/parity_corpus/spec/commonmark-0.31.2/empty.stderr"
expected_exit = 0
idempotent = true

