schema_version = 1
corpus = "flowmark-language-neutral-conformance"

[[case]]
id = "preservation.extension.attribute-group.inline-compatible"
change_id = "FM-EXT-ATTRIBUTE-GROUP-001"
description = "Inline attribute groups preserve classes, IDs, quoted values, escapes, Unicode, and multiple adjacent groups."
kind = "stdin"
tags = ["attribute", "desired-output", "extension", "inline", "preservation", "stdin", "unicode"]
args = ["--width", "0", "--smartquotes", "--ellipses", "-"]
stdin = "tests/parity_corpus/cases/preservation/extensions/attribute-group/inline-compatible/input.md"
expected_stdout = "tests/parity_corpus/cases/preservation/extensions/attribute-group/inline-compatible/expected.stdout"
expected_stderr = "tests/parity_corpus/spec/commonmark-0.31.2/empty.stderr"
expected_exit = 0
idempotent = true

