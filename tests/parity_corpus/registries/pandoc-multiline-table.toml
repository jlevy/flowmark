schema_version = 1
corpus = "flowmark-language-neutral-conformance"

[[case]]
id = "preservation.extension.multiline-table.headered"
change_id = "FM-EXT-MULTILINE-TABLE-001"
description = "A headered Pandoc multiline table retains column rules, row gaps, and cell line structure."
kind = "stdin"
tags = ["desired-output", "extension", "multiline-table", "pandoc", "preservation", "stdin"]
args = ["--width", "20", "--smartquotes", "--ellipses", "-"]
stdin = "tests/parity_corpus/cases/preservation/extensions/multiline-table/headered/input.md"
expected_stdout = "tests/parity_corpus/cases/preservation/extensions/multiline-table/headered/expected.stdout"
expected_stderr = "tests/parity_corpus/spec/commonmark-0.31.2/empty.stderr"
expected_exit = 0
idempotent = true

