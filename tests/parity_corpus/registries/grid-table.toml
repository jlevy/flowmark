schema_version = 1
corpus = "flowmark-language-neutral-conformance"

[[case]]
id = "preservation.extension.grid-table.headered"
change_id = "FM-EXT-GRID-TABLE-001"
description = "A headered grid table retains multiline/list cells, Unicode, math, code, and a following caption."
kind = "stdin"
tags = ["desired-output", "extension", "grid-table", "math", "pandoc", "preservation", "stdin"]
args = ["--width", "24", "--smartquotes", "--ellipses", "-"]
stdin = "tests/parity_corpus/cases/preservation/extensions/grid-table/headered/input.md"
expected_stdout = "tests/parity_corpus/cases/preservation/extensions/grid-table/headered/expected.stdout"
expected_stderr = "tests/parity_corpus/spec/commonmark-0.31.2/empty.stderr"
expected_exit = 0
idempotent = true

[[case]]
id = "preservation.extension.grid-table.spans"
change_id = "FM-EXT-GRID-TABLE-001"
description = "Interior border signatures may differ for row and column spans while the outer border closes exactly."
kind = "stdin"
tags = ["desired-output", "extension", "grid-table", "pandoc", "preservation", "spans", "stdin"]
args = ["--width", "0", "-"]
stdin = "tests/parity_corpus/cases/preservation/extensions/grid-table/spans/input.md"
