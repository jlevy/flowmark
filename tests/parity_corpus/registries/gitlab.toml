schema_version = 1
corpus = "flowmark-language-neutral-conformance"

[[case]]
id = "preservation.extension.gitlab.references"
change_id = "FM-EXT-GLFM-001"
description = "GitLab bracketed references preserve source-exact values that resemble emphasis or typography."
kind = "stdin"
tags = ["desired-output", "extension", "gitlab", "glfm", "inline", "issue-67", "preservation", "reference", "stdin", "unicode"]
args = ["--width", "0", "--smartquotes", "--ellipses", "-"]
stdin = "tests/parity_corpus/cases/preservation/extensions/gitlab/references/input.md"
expected_stdout = "tests/parity_corpus/cases/preservation/extensions/gitlab/references/expected.stdout"
expected_stderr = "tests/parity_corpus/spec/commonmark-0.31.2/empty.stderr"
expected_exit = 0
idempotent = true

