schema_version = 1
corpus = "flowmark-language-neutral-conformance"

[[case]]
id = "preservation.extension.line-block.inline-content"
change_id = "FM-EXT-LINE-BLOCK-001"
description = "Pandoc line blocks preserve authored Unicode, indentation, math, code, hard breaks, and typography-shaped text."
kind = "stdin"
tags = ["desired-output", "extension", "line-block", "pandoc", "preservation", "stdin", "unicode"]
args = ["--width", "18", "--smartquotes", "--ellipses", "-"]
stdin = "tests/parity_corpus/cases/preservation/extensions/line-block/inline-content/input.md"
expected_stdout = "tests/parity_corpus/cases/preservation/extensions/line-block/inline-content/expected.stdout"
expected_stderr = "tests/parity_corpus/spec/commonmark-0.31.2/empty.stderr"
expected_exit = 0
idempotent = true

