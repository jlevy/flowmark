schema_version = 1
corpus = "flowmark-language-neutral-conformance"

[[case]]
id = "preservation.extension.definition-list.terms-definitions"
change_id = "FM-EXT-DEFINITION-LIST-001"
description = "Multiple terms and definitions retain marker choice, spacing, continuations, inline math, code, and typography."
kind = "stdin"
tags = ["definition-list", "desired-output", "extension", "math", "preservation", "stdin", "typography"]
args = ["--width", "22", "--smartquotes", "--ellipses", "-"]
stdin = "tests/parity_corpus/cases/preservation/extensions/definition-list/terms-definitions/input.md"
expected_stdout = "tests/parity_corpus/cases/preservation/extensions/definition-list/terms-definitions/expected.stdout"
expected_stderr = "tests/parity_corpus/spec/commonmark-0.31.2/empty.stderr"
expected_exit = 0
idempotent = true

